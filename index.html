<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С 8 Марта!</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(#ffe6f0,#ffffff);
    text-align:center;
    margin:0;
}

header {
    background:#ff4da6;
    color:white;
    padding:40px;
}

.section {
    padding:40px;
}

img {
    width:250px;
    border-radius:15px;
    margin:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.video {
    margin-top:30px;
}

footer {
    background:#ff4da6;
    color:white;
    padding:20px;
}
</style>
</head>

<body>

<header>
<h1>🌷 Дорогие коллеги!</h1>
<h2>Поздравляем вас с 8 Марта!</h2>
</header>

<div class="section">
<h2>Наши прекрасные девушки</h2>

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">

</div>

<div class="section">
<h2>Пожелания</h2>
<p>
Желаем счастья, вдохновения, улыбок,
успехов и весеннего настроения!
</p>
</div>

<div class="section">
<h2>Музыкальное поздравление 🎵</h2>

<audio controls autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<div class="section video">
<h2>Видео от мужского коллектива</h2>

<video width="600" controls>
  <source src="video.mp4" type="video/mp4">
</video>

</div>

<footer>
С любовью ❤️ Мужской коллектив
</footer>

</body>
</html>
